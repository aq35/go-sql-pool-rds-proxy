name: CI

# Every pull request shows these as separate checks: format, lint, tests, vulnerabilities, and a content policy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt, vet, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lab/go.mod
          cache-dependency-path: lab/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4
          working-directory: lab
      - name: go test (race, coverage)
        run: |
          go test -race -coverprofile=cover.out ./... | tee test.txt
          { echo "### go test"; echo '```'; cat test.txt; go tool cover -func=cover.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: build and validate experiment definitions
        run: |
          go build -o lab .
          python3 -I exp.py check

  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable          # latest patch release: standard-library findings in old toolchains disappear
          cache-dependency-path: lab/go.sum
      - name: govulncheck
        # Reported, not blocking: the known finding (golang.org/x/text, GO-2026-5970) is fixed only in a version that requires
        # Go 1.25, but the lab binary is built on an isolated EC2 instance with the distribution's Go (no toolchain download).
        # Raise the `go` line in lab/go.mod and the instance's Go together, then make this check blocking.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          govulncheck ./... > vuln.txt 2>&1
          code=$?
          set -e
          { echo "### govulncheck"; echo '```'; tail -40 vuln.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::warning title=govulncheck::vulnerabilities reported (exit $code); see the job summary"; fi

  python:
    name: Python (lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - name: ruff (syntax errors, undefined / unused names)
        run: ruff check lab/*.py scripts/*.py --select E9,F
      - name: compile
        run: python -I -m py_compile lab/exp.py lab/rules.py scripts/summarize.py scripts/finish.py scripts/derive_coeffs.py scripts/gen_validation.py scripts/fetch_pricing.py
      - name: unit tests
        working-directory: lab
        run: |
          python test_rules.py
          python -m unittest -v test_exp 2>&1 | tee ../unittest.txt
          { echo "### python unit tests"; echo '```'; tail -5 ../unittest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning lab/*.sh scripts/*.sh

  infra:
    name: Infra (CDK type-check, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit -p .
      - name: npm audit (blocking at high / critical)
        run: npm audit --audit-level=high
      - name: npm audit (all severities, report only)
        run: |
          npm audit > ../audit.txt 2>&1 || true
          { echo "### npm audit (all severities)"; echo '```'; tail -30 ../audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: No credentials / account ids / endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-sensitive.sh

  dependency-review:
    name: Dependency review (new vulnerable dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
        continue-on-error: true       # needs the repository's dependency graph; do not fail the PR if it is not enabled
