name: CI

# Every pull request shows these as separate checks: format, lint, tests, vulnerabilities, and a content policy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go }} (fmt, vet, lint, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable]        # the go.mod minimum, and the latest (the lab is built on EC2 with the distribution's Go)
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: lab/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4
          working-directory: lab
      - name: go test (race, coverage)
        run: |
          go test -race -coverprofile=cover.out ./... | tee test.txt
          { echo "### go test"; echo '```'; cat test.txt; go tool cover -func=cover.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: build and validate experiment definitions
        run: |
          go build -o lab .
          python3 -I exp.py check

  govulncheck:
    name: Go vulnerabilities (govulncheck gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable          # latest patch release: standard-library findings of old toolchains disappear
          cache-dependency-path: lab/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: text report (always shown)
        run: |
          govulncheck ./... > vuln.txt || true
          { echo "### govulncheck"; echo '```'; tail -40 vuln.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: gate (blocking)
        # Fails on any CALLED vulnerability that is not in docs/known-vulnerabilities.json, or whose entry has expired.
        # The known finding, its reachability, the EC2 Go version and the upgrade plan: docs/known-vulnerabilities.md
        run: |
          govulncheck -json ./... > vuln.json
          python3 ../scripts/vuln_gate.py vuln.json ../docs/known-vulnerabilities.json

  python:
    name: Python (lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - name: ruff (syntax errors, undefined / unused names)
        run: ruff check lab/*.py scripts/*.py --select E9,F
      - name: compile
        run: python -I -m py_compile lab/exp.py lab/rules.py scripts/summarize.py scripts/finish.py scripts/derive_coeffs.py scripts/gen_validation.py scripts/fetch_pricing.py
      - name: unit tests
        working-directory: lab
        run: |
          python test_rules.py
          python ../scripts/test_vuln_gate.py
          python -m unittest -v test_exp 2>&1 | tee ../unittest.txt
          { echo "### python unit tests"; echo '```'; tail -5 ../unittest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning lab/*.sh scripts/*.sh

  infra:
    name: Infra (CDK type-check, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit -p .
      - name: npm audit (blocking at high / critical)
        run: npm audit --audit-level=high
      - name: npm audit (all severities, report only)
        run: |
          npm audit > ../audit.txt 2>&1 || true
          { echo "### npm audit (all severities)"; echo '```'; tail -30 ../audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: No credentials / account ids / endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-sensitive.sh
